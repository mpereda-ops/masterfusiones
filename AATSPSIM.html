const RX = {
  accuse:/(deber[íi]as|ten[íi]as que|tienes que|por qu[ée] no|es tu culpa|has fallado|siempre|nunca|otra vez|no puedes|est[áa] mal|te toca|you should|you have to|why didn'?t you|your fault|you failed|always|never|again|you can'?t)/i,
  solve:/(la soluci[óo]n|deber[íi]as hacer|tienes que hacer|te propongo|haz esto|lo que hay que hacer|simplemente|solo tienes que|basta con|prueba a|delega|organ[íi]zate|the solution|you should just|you need to|just |simply|delegate|get organized)/i,
  empath:/(entiendo|comprendo|imagino|siento que|lo siento|gracias|aprecio|valoro|debe (de )?ser|c[óo]mo (est[áa]s|te sientes|lo llevas)|te escucho|cu[ée]ntame|qu[ée] necesitas|i understand|i imagine|i'?m sorry|thank you|thanks|i appreciate|i value|must be|how are you|how do you feel|tell me|what do you need|i hear you)/i,
  question:/\?/
};
function classify(t){ const s=" "+t.toLowerCase()+" ";
  if(RX.accuse.test(s)) return "accuse";
  if(RX.solve.test(s)) return "solve";
  if(RX.empath.test(s)||RX.question.test(s)) return "empath";
  return "neutral"; }

async function callAI(system, messages, maxTokens){
  if(!TUTOR_CONFIG.endpoint) throw new Error("sin endpoint");
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), TUTOR_CONFIG.timeoutMs);
  try{
    const resp=await fetch(TUTOR_CONFIG.endpoint,{ method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:TUTOR_CONFIG.model,system,messages,max_tokens:maxTokens||TUTOR_CONFIG.maxTokens}),
      signal:ctrl.signal });
    clearTimeout(timer);
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const data=await resp.json();
    let content=null;
    if(Array.isArray(data.content)) content=data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    else if(typeof data.content==="string") content=data.content;
    else if(data.text) content=data.text;
    if(!content) throw new Error("vacío");
    return content;
  }catch(e){ clearTimeout(timer); throw e; }
}

function tryParseJSON(raw){
  if(!raw) return null;
  let s=raw.replace(/```json/gi,"").replace(/```/g,"").trim();
  const i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i!==-1 && j!==-1 && j>i) s=s.slice(i,j+1);
  const attempts=[
    s,
    s.replace(/,(\s*[}\]])/g,"$1"),
    s.replace(/,(\s*[}\]])/g,"$1").replace(/[\u201C\u201D]/g,'\\"').replace(/[\u2018\u2019]/g,"'")
  ];
  for(const a of attempts){ try{ return JSON.parse(a); }catch(e){} }
  return null;
}

async function generate(){
  const f=state.draft;
  if(!f.situation.trim()||!f.goal.trim()){ set({error:t("err_fill")}); return; }
  set({ error:"", view:"generating" });
  const ch=chObjOf(f.challenge);
  const prompt=`CASO REAL DE UN LÍDER DE CAPÍTULO AATSP
Persona: ${f.person||"(sin especificar)"}
Reto: ${chLabel(ch)} — foco de liderazgo: ${chLens(ch)}
Requisito de AATSP en juego: ${chAatsp(ch)}
Situación: ${f.situation}
Objetivo del líder: ${f.goal}
${f.challenge==="otro" ? "\nEl tipo de reto es abierto o no está definido: INFIERE el más probable a partir de la situación descrita y diseña el personaje igualmente. NO pidas aclaraciones ni devuelvas preguntas; devuelve directamente el JSON del personaje.\n" : ""}
Diseña el personaje y devuelve solo el JSON en ${langName()}.`;
  let obj=null;
  for(let attempt=0; attempt<3 && !obj; attempt++){
    try{
      const p = attempt===0 ? prompt : prompt+"\n\nRECUERDA: devuelve ÚNICAMENTE el objeto JSON completo, empezando por { y terminando por }, sin ningún texto adicional. Mantén los campos breves para que quepa entero.";
      const raw=await callAI(genSystem(),[{role:"user",content:p}], 1500);
      obj=tryParseJSON(raw);
      if(obj && (!obj.persona||!obj.opener)) obj=null;
    }catch(e){}
  }
  if(!obj){ set({ error:t("err_gen"), view:"build" }); return; }
  if(!Array.isArray(obj.traits)) obj.traits=[];
  if(!obj.characterName) obj.characterName = state.lang==="en"?"The person":"La persona";
  if(!obj.aatsp) obj.aatsp = chAatsp(ch);
  const c=newCaseObj({person:f.person,challenge:f.challenge,situation:f.situation,goal:f.goal});
  obj.opener=softenLang(obj.opener); c.char=obj; c.messages=[{role:"them",content:obj.opener}];
  state.cases.push(c);
  set({ currentId:c.id, view:"dashboard", hint:null });
}

async function getReply(){
  const c=cur(); if(!c) return;
  set({ thinking:true, error:"", hint:null });
  try{
    const history=c.messages.filter((m,i)=>!(i===0&&m.role==="them"))
      .map(m=>({role:m.role==="you"?"user":"assistant",content:m.content}));
    const sys=c.char.persona+`\n\nTu primera frase fue: "${c.char.opener}". Continúa la conversación de forma natural en ${langName()}. IMPORTANTE: mantén SIEMPRE un registro respetuoso y profesional, propio de un seminario universitario; NUNCA uses palabras malsonantes, tacos ni lenguaje vulgar, aunque el personaje esté enfadado o dolido. NUNCA inventes ni uses un nombre propio para dirigirte al líder (no conoces su nombre): diríjete a él de forma natural, sin nombres.`;
    const reply=await callAI(sys,history);
    c.messages.push({role:"them",content:softenLang(reply)});
    set({ thinking:false });
  }catch(e){ set({ thinking:false, error:t("err_conn") }); }
}

async function send(){
  const c=cur(); if(!c||state.thinking) return;
  const last=c.messages[c.messages.length-1];
  if(last && last.role==="you"){ await getReply(); return; }
  const ta=document.getElementById("input"); const text=(ta?ta.value:"").trim();
  if(!text) return;
  const kind=classify(text);
  if(kind==="empath") c.tally.empath++;
  if(kind==="accuse") c.tally.accuse++;
  if(kind==="solve") c.tally.solve++;
  if(RX.question.test(text)) c.tally.question++;
  c.prevOpen=c.openness;
  if(kind==="empath") c.openness=Math.min(5,c.openness+1);
  else if(kind==="accuse"||kind==="solve") c.openness=Math.max(0,c.openness-1);
  c.messages.push({role:"you",content:text});
  await getReply();
}

function retry(){ const c=cur(); if(!c||state.thinking) return;
  const last=c.messages[c.messages.length-1];
  if(last && last.role==="you") getReply(); }

  const prompt=`Objetivo: ${c.form.goal}\n\nConversación:\n${transcript}\n\nSugiere la próxima intervención del líder.`;

function softenLang(s){
  if(!s) return s;
  const rules=[
    [/\b(joder|jolines|jope|jolín)\b/gi,"vaya"],
    [/\b(hostias?)\b/gi,"madre mía"],
    [/\b(co[ñn]o)\b/gi,"vaya"],
    [/\b(mierda)\b/gi,"desastre"],
    [/\bme cago en [a-záéíóúñ ]+/gi,""],
    [/\b(cabr[oó]n|cabrona|gilipollas|gilipolle[cz]e?s?|capullo|put[ao]s?|joputa|hijo de puta)\b/gi,""],
    [/\b(fuck(ing)?|shit|damn|crap|bastard|asshole|bullshit)\b/gi,""]
  ];
  let out=s;
  for(const r of rules) out=out.replace(r[0],r[1]);
  out=out.replace(/\s{2,}/g," ").replace(/\s+([,.;:!?…])/g,"$1").replace(/^[\s,;:¡!]+/,"").trim();
  if(out) out=out.charAt(0).toUpperCase()+out.slice(1);
  return out;
}

function parseFeedback(text){
  const parts=text.split("###").map(p=>p.trim()).filter(Boolean);
  const out=parts.map(p=>{ const nl=p.indexOf("\n");
    return {title: nl===-1?p:p.slice(0,nl).trim(), body: nl===-1?"":p.slice(nl+1).trim()}; });
  return out.length?out:[{title:"Feedback",body:text}];
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    <h2>${t("rep_char")}</h2>
    <div class="kv"><b>${esc(who)}</b> — ${esc(c.char.characterRole||"")} <span class="tag">${t("rep_openness")}: ${c.openness}/5</span></div>
    <h2>${t("rep_conv")}</h2>
    ${rows||"<div style='color:#777;'>—</div>"}
    <h2>${t("rep_fb")}</h2>
    ${fb}
    <div class="foot"><b>${t("footer_strong")}</b> ${t("footer_b")}<br>${t("rep_gen")} · Jorge Matías-Pereda · mpereda@usal.es</div>
  </body></html>`;
  const iframe=document.createElement("iframe");
  iframe.style.position="fixed"; iframe.style.right="0"; iframe.style.bottom="0";
  iframe.style.width="0"; iframe.style.height="0"; iframe.style.border="0";
  document.body.appendChild(iframe);
  const d=iframe.contentWindow.document; d.open(); d.write(doc); d.close();
  setTimeout(()=>{ try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){}
    setTimeout(()=>{ try{document.body.removeChild(iframe);}catch(e){} }, 1500); }, 500);
}

    clipboard:'<rect x="6" y="4.5" width="12" height="15.5" rx="2.2"/><rect x="9" y="3" width="6" height="3" rx="1.2"/>',
    listen:'<path d="M4.5 13a7.5 7.5 0 0115 0"/><path d="M7.5 13a4.5 4.5 0 019 0"/><path d="M10.5 13a1.5 1.5 0 013 0"/>',
    heart:'<path d="M12 20s-6.5-4.2-9-8.3C1.2 8.5 3 5 6.6 5c2 0 3 1.2 5.4 3.6C14.4 6.2 15.4 5 17.4 5 21 5 22.8 8.5 21 11.7 18.5 15.8 12 20 12 20z"/>',

    quote:'<path d="M9 7H6a2 2 0 00-2 2v3a2 2 0 002 2h1v3H4M18 7h-3a2 2 0 00-2 2v3a2 2 0 002 2h1v3h-3"/>',
    shield:'<path d="M12 3.2l7.5 2.8v5.5c0 4.7-3.6 7.5-7.5 8.5-3.9-1-7.5-3.8-7.5-8.5V6L12 3.2z"/>',
    sparkles:'<path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6L12 4z"/><path d="M18.5 4.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6.6-1.6z"/>',
    bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.8 1 1.2 1 2.5h6c0-1.3.2-1.7 1-2.5A6 6 0 0012 3z"/>',
    send:'<path d="M4.5 11.5L20 5l-6.5 15.5-2.2-6.3-6.8-2.7z"/><path d="M20 5l-8.7 8.7"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11.5v4.5M12 8h.02"/>',
    folder:'<path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v7a2 2 0 01-2 2H6a2 2 0 01-2-2V7z"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    trash:'<path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    chevron:'<path d="M6 9l6 6 6-6"/>',
    download:'<path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/>',

function iconCircle(name,bg,fg,sz){ sz=sz||36;
  return '<span style="width:'+sz+'px;height:'+sz+'px;border-radius:11px;background:'+bg+';display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;">'+ic(name,Math.round(sz*0.52),fg,1.9)+'</span>'; }
function checkDot(on){ return on
  ? '<span style="width:22px;height:22px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg></span>'
  : '<span style="width:22px;height:22px;border-radius:50%;border:1.6px solid var(--line);display:inline-block;"></span>'; }
function logo(sz){ sz=sz||30;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 40 40" fill="none">'+
    '<path d="M25 8c-6-2-13 1-13 7 0 7 14 4 14 11 0 5-7 7-12 5" stroke="#4F7CFF" stroke-width="4.2" stroke-linecap="round"/>'+
    '<path d="M15 32c6 2 13-1 13-7 0-7-14-4-14-11 0-5 7-7 12-5" stroke="#8B5CF6" stroke-width="4.2" stroke-linecap="round" opacity="0.9"/></svg>'; }
function personAvatar(sz){
  const c=cur()||{}; const ch=c.char||{}; const src=AVATARS[ch.avatar];
  const initial=esc((ch.characterName||"?").charAt(0));
  if(src) return '<img src="'+src+'" alt="" style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 1px 3px rgba(30,34,51,.16);">';
  return '<span style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:'+Math.round(sz*0.38)+'px;flex:0 0 auto;">'+initial+'</span>';

function opennessBar(v){ let seg="";

    seg+='<span style="flex:1;height:8px;border-radius:5px;background:'+(on?'var(--grad)':'#E7E5F2')+';"></span>'; }

/* ── Render ── */
function render(){
  const app=document.getElementById("app");
  app.innerHTML = topbar() + casesPanel() + stepper() +
    (state.view==="build" ? viewBuild()
     : state.view==="generating" ? viewGenerating()
     : viewDashboard());
  const thread=document.getElementById("thread"); if(thread) thread.scrollTop=thread.scrollHeight;
  const ta=document.getElementById("input");
  if(ta){ ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,160)+"px";});
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}); }
}

        </div>

    </div>

function stepper(){ const cur_=currentStep(); const canFb=cur()&&youCount()>0;
  const step=(n,label,icon,onclick)=>{ const active=n===cur_, done=n<cur_; const cl=!!onclick;
    return `<div ${cl?`onclick="${onclick}"`:''} style="display:flex;align-items:center;gap:10px;${cl?'cursor:pointer;':''}">

          : 'background:#fff;border:1.6px solid var(--line);color:#B4B2C4;'}">${ic(icon,17,active?'var(--primary)':done?'#fff':'#B4B2C4')}</span>
      <span style="font-size:14px;font-weight:${active?'600':'500'};color:${active?'var(--primary)':done?'var(--ink)':'#9C9AAE'};white-space:nowrap;">${label}</span>
    </div>`; };
  const sep=`<span style="flex:0 0 40px;height:1px;border-top:1.6px dashed var(--line);"></span>`;
  const s3=canFb?"getFeedback()":"";

      </div>
    </div>
    <button onclick="downloadReport()" ${youCount()===0?"disabled":""} style="width:100%;margin-top:16px;background:#fff;border:1px solid var(--line);color:var(--primary);padding:12px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;" class="card-sh">${ic("download",17,"var(--primary)")} ${t("pdf_btn")}</button>
  </div>`; }

function colChat(){ const c=cur(); const ch=c.char, disabled=youCount()===0;
  const traits=(ch.traits||[]).slice(0,3);
  const tc=[["var(--purpleSoft)","var(--primary)"],["var(--amberSoft)","var(--amber)"],["var(--greenSoft)","var(--green)"]];
  const traitChips=traits.map((x,i)=>`<span style="background:${tc[i%3][0]};color:${tc[i%3][1]};border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;">${esc(x)}</span>`).join("");
  const msgs=c.messages.map(m=>{
    const you=m.role==="you";
    const bubble=`<div style="background:${you?'var(--blueSoft)':'#F6F6FB'};color:var(--ink);border-radius:${you?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:12px 15px;font-size:14.5px;line-height:1.55;max-width:74%;">${esc(m.content)}</div>`;
    const av=you
      ? '<span style="width:30px;height:30px;border-radius:50%;background:var(--purpleSoft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;">'+ic("user",16,"var(--primary)")+'</span>'
      : personAvatar(30);
    return `<div class="msg" style="display:flex;gap:9px;justify-content:${you?'flex-end':'flex-start'};align-items:flex-end;">${you?"":av}${bubble}${you?av:""}</div>`;
  }).join("");
  const typing=state.thinking?`<div class="msg" style="display:flex;gap:9px;align-items:flex-end;">${personAvatar(30)}<div style="background:#F6F6FB;border-radius:16px 16px 16px 4px;padding:13px 16px;"><span class="dot"></span><span class="dot" style="animation-delay:.2s"></span><span class="dot" style="animation-delay:.4s"></span></div></div>`:"";
  const hintBox = state.hint ? `<div style="background:var(--amberSoft);border:1px solid #F5D89A;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;">
      ${ic("bulb",18,"var(--amber)")}
      <div style="flex:1;"><div style="font-size:12.5px;font-weight:700;color:var(--amber);margin-bottom:3px;">${t("hint_title")}</div><div style="font-size:13.5px;color:var(--ink2);line-height:1.55;">${esc(state.hint)}</div></div>
      <button onclick="dismissHint()" style="background:transparent;color:var(--amber);padding:2px;">${ic("x",15,"var(--amber)")}</button>
    </div>` : "";
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px 18px;display:flex;flex-direction:column;min-height:600px;" class="card-sh">
    <div style="font-size:12.5px;font-weight:600;color:var(--primary);margin-bottom:12px;">${t("char_by_ai")}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line2);">
      <div style="display:flex;align-items:center;gap:13px;">
        ${personAvatar(52)}
        <div>
          <div style="font-size:18px;font-weight:700;line-height:1.2;">${esc(ch.characterName||"")}</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${esc(ch.characterRole||"")}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${traitChips}</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px;justify-content:flex-end;">${t("openness")} ${ic("info",13,"#B4B2C4")}</div>
        ${opennessBar(c.openness)}
        <div style="font-size:13px;font-weight:700;margin-top:5px;">${c.openness} / 5</div>
      </div>
    </div>
    <div class="thread" id="thread" style="flex:1;overflow-y:auto;max-height:44vh;padding:16px 2px 8px;display:flex;flex-direction:column;gap:14px;">${msgs}${typing}</div>
    ${state.error?`<div style="margin:8px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><span style="color:#DC2626;font-size:13px;">${esc(state.error)}</span>${(c.messages.length&&c.messages[c.messages.length-1].role==="you"&&!state.thinking)?`<button onclick="retry()" style="background:#DC2626;color:#fff;border-radius:8px;font-size:13px;font-weight:600;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;">${ic("send",14,"#fff")} ${t("retry")}</button>`:""}</div>`:""}
    <div style="margin-top:14px;">
      ${hintBox}
      <div style="display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap;">
        <button onclick="suggest()" ${state.suggesting?"disabled":""} class="tool-btn">${ic("sparkles",15,"var(--primary)")} ${state.suggesting?t("btn_thinking"):t("btn_suggest")}</button>
        <button onclick="askHint()" ${state.hinting?"disabled":""} class="tool-btn">${ic("bulb",15,"var(--amber)")} ${state.hinting?t("btn_thinking"):t("btn_hint")}</button>
        <button onclick="getFeedback()" ${disabled?"disabled":""} class="tool-btn" style="color:var(--green);">${ic("star",15,"var(--green)")} ${t("btn_fb_now")}</button>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-end;background:#F8F8FC;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;">
        <textarea id="input" rows="1" placeholder="${t("input_ph")}" style="flex:1;resize:none;border:none;background:transparent;font-size:15px;line-height:1.45;min-height:26px;max-height:160px;padding:4px 0;color:var(--ink);"></textarea>
        <button onclick="send()" ${state.thinking?"disabled":""} class="grad-btn" style="padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">${ic("send",16,"#fff")} ${t("send")}</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;">${t("input_help")}</p>
    </div>
  </div>`; }

function colCoach(){ const c=cur(); const tal=c.tally;
  const listenOn=tal.question>=1, valOn=tal.empath>=1;
  const trendUp=c.openness>c.prevOpen, trendDown=c.openness<c.prevOpen;
  const trendTxt = youCount()===0?t("trend_none") : trendUp?t("trend_up") : trendDown?t("trend_down") : t("trend_stable");
  const trendIcon = trendUp?ic("trend",18,"var(--primary)"):trendDown?ic("trend",18,"var(--amber)"):ic("trend",18,"var(--muted)");
  const liveRow=(icon,bg,fg,title,sub,right)=>`<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);">
    ${iconCircle(icon,bg,fg,34)}
    <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${title}</div><div style="font-size:12.5px;color:var(--muted);">${sub}</div></div>
    ${right}</div>`;
  let fbBlock;
  if(state.loadingFb){
    fbBlock=`<div style="text-align:center;padding:20px 0;"><span class="dot"></span><span class="dot" style="animation-delay:.2s"></span><span class="dot" style="animation-delay:.4s"></span><p style="font-size:13px;color:var(--muted);margin-top:10px;">${t("fb_analyzing")}</p></div>`;
  } else if(c.feedback){
    const cf=[["star","var(--greenSoft)","var(--green)"],["trend","var(--amberSoft)","var(--amber)"],["quote","var(--purpleSoft)","var(--primary)"]];
    fbBlock=c.feedback.map((sec,i)=>`<div style="display:flex;gap:10px;padding:11px 0;${i<2?'border-bottom:1px solid var(--line2);':''}">
      ${iconCircle(cf[i]?cf[i][0]:"star",cf[i]?cf[i][1]:"var(--greenSoft)",cf[i]?cf[i][2]:"var(--green)",30)}
      <div><div style="font-size:13.5px;font-weight:700;color:${cf[i]?cf[i][2]:'var(--ink)'};margin-bottom:2px;">${esc(sec.title)}</div>
        <div style="font-size:12.5px;color:var(--ink2);line-height:1.55;white-space:pre-wrap;">${esc(sec.body)}</div></div></div>`).join("")
      + `<button onclick="getFeedback()" style="width:100%;margin-top:12px;background:var(--purpleSoft);color:var(--primary);padding:10px;border-radius:10px;font-size:13.5px;font-weight:600;">${t("fb_update")}</button>`;
  } else {
    const ready=youCount()>0;
    fbBlock=`<p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;">${ready?t("fb_ready"):t("fb_empty")}</p>
      <button onclick="getFeedback()" ${ready?"":"disabled"} class="grad-btn" style="width:100%;padding:12px;border-radius:11px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;">${ic("star",16,"#fff")} ${t("fb_get")}</button>`;
  }
  return `<div class="side-col">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;" class="card-sh">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:9px;">${iconCircle("sparkles","var(--purpleSoft)","var(--primary)",30)}<span style="font-size:16px;font-weight:700;">${t("coach")}</span></div>
        <span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green);font-weight:600;"><span style="width:7px;height:7px;border-radius:50%;background:var(--green);"></span> ${t("live_badge")}</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px;">${t("live_read")}</div>
      ${liveRow("listen","var(--blueSoft)","var(--blue)",t("listen"),listenOn?t("listen_ok"):t("listen_no"),checkDot(listenOn))}
      ${liveRow("heart","var(--pinkSoft)","var(--pink)",t("validate"),valOn?t("validate_ok"):t("validate_no"),checkDot(valOn))}
      ${liveRow("trend","var(--purpleSoft)","var(--primary)",t("trend"),trendTxt,'<span style="color:'+(trendUp?'var(--green)':trendDown?'var(--amber)':'var(--muted)')+';">'+trendIcon+'</span>')}
    </div>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px;" class="card-sh">
      <div style="font-size:15px;font-weight:700;color:var(--primary);margin-bottom:12px;">${t("fb_head")}${c.feedback?"":' <span style="font-size:11.5px;color:var(--muted);font-weight:400;">'+t("fb_when")+'</span>'}</div>
      ${fbBlock}
    </div>
    <div style="display:flex;gap:11px;align-items:flex-start;margin-top:16px;padding:2px 6px;">
      ${ic("shield",20,"#B4B2C4")}
      <div><div style="font-size:13px;font-weight:600;color:var(--ink2);">${t("whatis_t")}</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.55;">${t("whatis_b")}</div></div>
    </div>
  </div>`; }

function classFooter(){ return `
  <div style="max-width:1280px;margin:34px auto 0;padding:18px 26px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6;">
    <strong style="color:var(--ink2);">${t("footer_strong")}</strong> ${t("footer_b")} · Jorge Matías-Pereda · mpereda@usal.es
  </div>`; }

document.documentElement.lang=state.lang;
try{ const sl=localStorage.getItem("synetrix_lang"); if(sl==="en"||sl==="es"){ state.lang=sl; document.documentElement.lang=sl; } }catch(e){}
try{ const ul=new URLSearchParams(location.search).get("lang"); if(ul==="en"||ul==="es"){ state.lang=ul; document.documentElement.lang=ul; save(); } }catch(e){}
render();
</script>
</body>
</html>
